name: MORB contract tests

on:
  pull_request:
  push:
    branches:
      - main
      - work/morb-contract-v1-foundation

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install draft contract package
        run: python -m pip install -e .
      - name: Test pure contract foundation
        run: python -m unittest discover -s tests -v
